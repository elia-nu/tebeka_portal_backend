version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tebeka_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: user_db,marketplace_db,financial_db,communication_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - tebeka-network

  redis:
    image: redis:7-alpine
    container_name: tebeka_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - tebeka-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tebeka_rabbitmq_prod
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
    networks:
      - tebeka-network

  mongodb:
    image: mongo:7.0
    container_name: tebeka_mongodb_prod
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - tebeka-network

  user-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.user-service
    container_name: tebeka_user_service_prod
    restart: always
    environment:
      NODE_ENV: production
      USER_SERVICE_PORT: 3001
      DATABASE_URL_USER: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/user_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-tebeka-internal-secret-change-in-production}
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - tebeka-network

  marketplace-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.marketplace-service
    container_name: tebeka_marketplace_service_prod
    restart: always
    environment:
      NODE_ENV: production
      MARKETPLACE_SERVICE_PORT: 3002
      DATABASE_URL_MARKETPLACE: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/marketplace_db?schema=public
      USER_SERVICE_INTERNAL_URL: http://user-service:3001/api/v1
      COMMUNICATION_SERVICE_INTERNAL_URL: http://communication-service:3004/api/v1/communication
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-tebeka-internal-secret-change-in-production}
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - user-service
    networks:
      - tebeka-network

  financial-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.financial-service
    container_name: tebeka_financial_service_prod
    restart: always
    environment:
      NODE_ENV: production
      FINANCIAL_SERVICE_PORT: 3003
      DATABASE_URL_FINANCIAL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/financial_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-tebeka-internal-secret-change-in-production}
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - tebeka-network

  communication-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.communication-service
    container_name: tebeka_communication_service_prod
    restart: always
    environment:
      NODE_ENV: production
      COMMUNICATION_SERVICE_PORT: 3004
      DATABASE_URL_COMMUNICATION: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/communication_db?schema=public
      MONGODB_URI: mongodb://mongodb:27017/tebeka_communication
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-tebeka-internal-secret-change-in-production}
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - mongodb
    networks:
      - tebeka-network

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api-gateway
    container_name: tebeka_api_gateway_prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 5000
      USER_SERVICE_URL: http://user-service:3001
      MARKETPLACE_SERVICE_URL: http://marketplace-service:3002
      FINANCIAL_SERVICE_URL: http://financial-service:3003
      COMMUNICATION_SERVICE_URL: http://communication-service:3004
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-tebeka-internal-secret-change-in-production}
    depends_on:
      - user-service
      - marketplace-service
      - financial-service
      - communication-service
    networks:
      - tebeka-network

  nginx:
    image: nginx:alpine
    container_name: tebeka_nginx_prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - tebeka-network

volumes:
  postgres_data_prod:
  redis_data_prod:
  rabbitmq_data_prod:
  mongo_data_prod:

networks:
  tebeka-network:
    driver: bridge
