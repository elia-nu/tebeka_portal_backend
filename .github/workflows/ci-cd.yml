name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - User-service-localization
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

env:
  NX_DAEMON: 'false'
  NX_TUI: 'false'
  CI: 'true'
  NODE_ENV: test
  JWT_SECRET: super-secret-jwt-key-change-in-production
  DATABASE_URL_USER: postgresql://postgres:postgres@localhost:5432/user_db?schema=public
  DATABASE_URL_MARKETPLACE: postgresql://postgres:postgres@localhost:5432/marketplace_db?schema=public
  DATABASE_URL_FINANCIAL: postgresql://postgres:postgres@localhost:5432/financial_db?schema=public
  DATABASE_URL_COMMUNICATION: postgresql://postgres:postgres@localhost:5432/communication_db?schema=public
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  RABBITMQ_URI: amqp://guest:guest@localhost:5672
  MONGODB_URI: mongodb://localhost:27017/tebeka_communication

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment File
        run: cp .env.example .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Clients
        run: |
          npx prisma generate --schema=apps/user-service/prisma/schema.prisma
          npx prisma generate --schema=apps/marketplace-service/prisma/schema.prisma
          npx prisma generate --schema=apps/financial-service/prisma/schema.prisma
          npx prisma generate --schema=apps/communication-service/prisma/schema.prisma

      - name: Run Tests
        run: npm test -- --runInBand

      - name: Build All Services
        run: npx nx run-many --target=build --all

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 7

  docker-build:
    name: Docker Build Check
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Build
        run: docker compose -f docker-compose.prod.yml build

  deploy:
    name: Deploy to Production
    needs: [build-and-test, docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/User-service-localization' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SSH_HOST || '116.203.122.210' }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "=== [CI/CD Deploy] Connecting to Production Server ==="
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/root/tebeka_portal_backend' }}"
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Deployment directory $DEPLOY_PATH not found, cloning..."
              mkdir -p "$DEPLOY_PATH"
              git clone git@github.com:elia-nu/tebeka_portal_backend.git "$DEPLOY_PATH"
            fi
            cd "$DEPLOY_PATH"
            echo "--> Deployment directory: $(pwd)"
            echo "--> Fetching latest git commits..."
            git fetch origin
            BRANCH="${{ github.ref_name }}"
            echo "--> Checking out branch: $BRANCH"
            git checkout "$BRANCH" || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH"
            echo "--> Running deploy script..."
            chmod +x scripts/deploy.sh
            bash scripts/deploy.sh
            echo "=== [CI/CD Deploy] Production Deployment Succeeded! ==="
